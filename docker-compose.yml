services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle23ai-lab
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_PWD=OracleLab2026
      - ORACLE_CHARACTERSET=AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./docker/init:/container-entrypoint-initdb.d
    shm_size: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  oracle_data: